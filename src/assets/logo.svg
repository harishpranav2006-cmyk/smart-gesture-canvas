<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="primaryGlow" x1="20" y1="20" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="canvasWave" x1="30" y1="180" x2="210" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#6366f1" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer ambient ring with radar gesture ticks -->
  <circle cx="120" cy="120" r="104" stroke="url(#primaryGlow)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.45"/>
  <circle cx="120" cy="120" r="92" stroke="#6366f1" stroke-width="1.5" opacity="0.2"/>

  <!-- Creative Canvas Dynamic Ribbon/Wave -->
  <path d="M 36 156 C 65 198, 120 188, 148 142 C 172 102, 195 90, 212 110" 
        stroke="url(#canvasWave)" stroke-width="7" stroke-linecap="round" filter="url(#shadowFilter)"/>
  
  <!-- Stylized Gesture Assistive Hand (Geometric, clean, modern) -->
  <g id="hand-silhouette" filter="url(#shadowFilter)">
    <!-- Palm base -->
    <path d="M 94 172 C 86 166, 82 152, 84 136 L 90 98 C 91 92, 98 88, 104 90 C 109 92, 112 97, 111 103 L 106 130" 
          stroke="url(#primaryGlow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Index Finger (Pointing forward / precision cursor) -->
    <path d="M 111 126 L 120 72 C 121 66, 128 62, 134 64 C 140 66, 143 72, 141 78 L 133 124" 
          stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <!-- Middle Finger -->
    <path d="M 133 124 L 144 76 C 145 70, 152 67, 158 69 C 163 71, 166 77, 164 83 L 152 128" 
          stroke="#818cf8" stroke-width="5" stroke-linecap="round"/>
    <!-- Ring Finger -->
    <path d="M 152 128 L 163 90 C 164 84, 171 81, 176 83 C 181 85, 184 91, 182 97 L 170 138" 
          stroke="#a78bfa" stroke-width="5" stroke-linecap="round"/>
    <!-- Pinky Finger -->
    <path d="M 170 138 L 180 112 C 181 106, 187 104, 192 106 C 196 109, 198 114, 196 119 L 182 150 C 176 164, 164 176, 148 180 Z" 
          stroke="#c084fc" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="#6366f1" fill-opacity="0.15"/>
    <!-- Thumb (Spread naturally for open palm gesture) -->
    <path d="M 92 142 L 72 126 C 66 121, 65 112, 70 106 C 75 101, 84 102, 89 108 L 102 128" 
          stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Gesture Sensor Interactive Pulse / Signal Waves -->
  <circle cx="120" cy="72" r="5" fill="#38bdf8" filter="url(#shadowFilter)"/>
  <circle cx="120" cy="72" r="14" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" opacity="0.8"/>
  <circle cx="120" cy="72" r="24" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.45"/>

  <!-- Canvas Brush Splatter / Color Accent Nodes -->
  <circle cx="68" cy="182" r="6" fill="#06b6d4"/>
  <circle cx="152" cy="192" r="8" fill="#8b5cf6"/>
  <circle cx="204" cy="116" r="6" fill="#f43f5e"/>
  <circle cx="190" cy="68" r="4.5" fill="#fbbf24"/>
</svg>
